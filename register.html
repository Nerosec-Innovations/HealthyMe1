<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
    />
    <link rel="stylesheet" href="base.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-white">
        <div class="container-fluid d-flex justify-content-between align-items-center">

          <div class="d-flex align-items-center">
            <a class="navbar-brand" href="#">
              <img src="logo.png" alt="Logo" />
            </a>
            <div class="healthyme-title d-flex align-items-center">
              <a href="#"><h1>HealthyMe</h1></a>
              <img src="plus.png" alt="plus" class="plus-icon" />
            </div>
          </div>
 <div class="d-flex align-items-center gap-3 d-md-none">
  <i
    class="bi bi-search"
    style="font-size: 20px; cursor: pointer;"
    onclick="toggleSearch()"
  ></i>
</div>
<div id="searchBox" class="container mt-2 d-md-none" style="display: none;">
  <input
    type="text"
    class="form-control"
    placeholder="Search here..."
  />
</div>
 <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          </div>
          <div class="collapse navbar-collapse gap-3" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-3">
              <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
              <li class="nav-item"><a class="nav-link" href="#">How To Use</a></li>
            </ul>
            <button class="btn btn-primary">Login</button>
          </div>
        </div>
      </nav>
      <section class="register mt-3">
       <div class="container">
    <div class="row">
        <div class="col-md-4">
          <div class="mt-5">
            <div>
                <h1>Sign Up to <br>
get your nutrients</h1>
            </div>
                <div class="mt-5">
                    <h4>if you already have an account
you can <a href="#">Login here!</a></h4>
                </div>
                </div>
        </div>
        <div class="col-md-4">
          <figure>
            <img src="boy.png" alt="Image not found" style="width: 100%;">
          </figure>
        </div>
        <div class="col-md-4">
          <div>
            <h1 class="mb-4">Welcome User</h1>
            <div class="card-box">
  <div class="input-group mb-3">
  <input type="email" class="form-control" id="myInput" placeholder="Enter Email">
  <span class="input-group-text">
    <i class="bi bi-x-circle" style="cursor:pointer;" onclick="clearInput()"></i>
  </span>
</div>
  <div class="input-group mb-3">
    <input type="password" id="password" class="form-control" placeholder="••••••••">
    <span class="input-group-text" onclick="togglePassword()">👁</span>
  </div>
  <div class="row g-2 mb-3">
    <div class="col-6">
      <input type="text" class="form-control" placeholder="Age">
    </div>
    <div class="col-6">
      <input type="text" class="form-control" placeholder="Gender">
    </div>
  </div>
  <div class="row g-2 mb-3">
    <div class="col-6">
      <input type="text" class="form-control" placeholder="Height">
    </div>
    <div class="col-6">
      <input type="text" class="form-control" placeholder="Weight">
    </div>
  </div>
  <button class="btn btn-custom w-100">Register</button>
  <div class="divider">Or continue with</div>
  <div class="d-flex justify-content-between social-btns">
    <button><i class="bi bi-google"></i></button>
    <button><i class="bi bi-apple"></i></button>
    <button><i class="bi bi-facebook"></i></button>
  </div>
</div>
          </div>
        <div class="mt-5 d-flex justify-content-end">
  <a href="#" onclick="toggleTheme()" id="themeBtn">Go Dark</a>
</div>

        </div>
    </div>
  </div>
    </section>
    <script> 
 function toggleSearch() {
  let search = document.getElementById("searchBox");

  if (search.style.display === "none") {
    search.style.display = "block";
  } else {
    search.style.display = "none";
  }
}
function clearInput() {
  let input = document.getElementById("myInput");
  input.value = "";
}
        </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
function togglePassword() {
  let pass = document.getElementById("password");

  if (pass.type === "password") {
    pass.type = "text";
  } else {
    pass.type = "password";
  }
}
function toggleTheme() {
  let body = document.body;
  let btn = document.getElementById("themeBtn");

  body.classList.toggle("dark-mode");

  if (body.classList.contains("dark-mode")) {
    btn.innerText = "Go Light";
  } else {
    btn.innerText = "Go Dark";
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
