<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HealthyMe UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Icons -->
 <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
    />
  <link rel="stylesheet" href="base.css">
</head>

<body>



  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-body-white">
        <div class="container-fluid d-flex justify-content-between align-items-center">

          <div class="d-flex align-items-center">
            <a class="navbar-brand" href="#">
              <img src="logo.png" alt="Logo" />
            </a>
            <div class="healthyme-title d-flex align-items-center">
              <a href="#"><h1>HealthyMe</h1></a>
              <img src="plus.png" alt="plus" class="plus-icon" />
            </div>
          </div>
 <div class="d-flex align-items-center gap-3 d-md-none">
  <i
    class="bi bi-search"
    style="font-size: 20px; cursor: pointer;"
    onclick="toggleSearch()"
  ></i>
</div>
<div id="searchBox" class="container mt-2 d-md-none" style="display: none;">
  <input
    type="text"
    class="form-control"
    placeholder="Search here..."
  />
</div>
 <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          </div>
          <div class="collapse navbar-collapse gap-0" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-0">
              <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
              <li class="nav-item"><a class="nav-link" href="#">How To Use</a></li>
            </ul>
            <button class="btn btn-primary">Login</button>
          </div>
        </div>
      </nav>
<div class="container mt-4">
  <div class="row">

    <!-- LEFT SIDE -->
    <div class="col-md-4">

      <!-- Search -->
      <div class="input-group mb-3">
        <input type="text" class="form-control" placeholder="Search your product">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
      </div>

      <!-- Image Box -->
      <div class="image-box text-center">
        <img src="Rectangle 1136.png"
             class="img-fluid rounded">
      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="col-md-8">

      <div class="card custom-card p-4">

        <h4>Product Name <i class="bi bi-info-circle"></i></h4>
        <p class="text-muted">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit ut aliquam, purus sit dolor
        </p>

        <!-- Nutrients -->
        <div class="d-flex justify-content-around mt-4">

          <div class="nutrient text-center">
            <div class="icon bg-orange"><i class="bi bi-box"></i></div>
            <p>Proteins<br><small>24g</small></p>
          </div>

          <div class="nutrient text-center">
            <div class="icon bg-pink"><i class="bi bi-droplet"></i></div>
            <p>Fats<br><small>54.3g</small></p>
          </div>

          <div class="nutrient text-center">
            <div class="icon bg-green"><i class="bi bi-flower1"></i></div>
            <p>Carbohydrates<br><small>13.2g</small></p>
          </div>

        </div>

        <!-- Alternatives -->
        <h6 class="mt-4">Alternative you can try</h6>

        <div class="d-flex gap-2 overflow-auto">

          <img src="/1.png" class="alt-img">
          <img src="/2.png" class="alt-img">
          <img src="/3.png" class="alt-img">
          <img src="/4.png" class="alt-img">
          <img src="/5.png" class="alt-img">

        </div>

      </div>

    </div>

  </div>
</div>

<script src="script.js">
  

    // Example: click alternative image to change main image
const altImages = document.querySelectorAll(".alt-img");
const mainImage = document.querySelector(".image-box img");

altImages.forEach(img => {
  img.addEventListener("click", () => {
    mainImage.src = img.src;
  });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
